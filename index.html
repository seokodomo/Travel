:root{--paper:#f6f4f0;--surface:#fff;--surface-2:#eeeae3;--ink:#1c2029;--ink-2:#4a5160;--ink-3:#7c8494;--line:#ddd7cc;--line-soft:#e9e4da;--kaki:#b0452c;--ai:#2c5470;--shadow:0 1px 2px rgba(28,32,41,.05),0 10px 30px -16px rgba(28,32,41,.28)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#14171d;--surface:#1b1f27;--surface-2:#242932;--ink:#e9e6df;--ink-2:#b2b8c4;--ink-3:#848c9a;--line:#333a46;--line-soft:#2a303a;--kaki:#e0785a;--ai:#7fb0d0;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -16px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{--paper:#14171d;--surface:#1b1f27;--surface-2:#242932;--ink:#e9e6df;--ink-2:#b2b8c4;--ink-3:#848c9a;--line:#333a46;--line-soft:#2a303a;--kaki:#e0785a;--ai:#7fb0d0;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -16px rgba(0,0,0,.7)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:16px;line-height:1.66;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:0 16px;padding-block:0 56px}
header{padding-block:44px 8px}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--kaki);font-weight:700}
h1{margin:10px 0 0;font-size:clamp(30px,8vw,40px);font-weight:700;letter-spacing:-.02em;line-height:1.2}
.sub{margin:12px 0 0;color:var(--ink-2);font-size:15px}
hr{border:0;border-top:2px solid var(--ink);margin:22px 0 0}
.list{display:grid;gap:14px;margin-top:26px}
a.trip{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:20px;box-shadow:var(--shadow);border-left:5px solid var(--kaki)}
a.trip:hover{border-color:var(--kaki)}
.city{font-size:24px;font-weight:700;letter-spacing:-.01em}
.when{margin-top:6px;font-size:16px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tags span{font-size:13px;background:var(--surface-2);border-radius:6px;padding:4px 10px;color:var(--ink-2)}
.go{display:inline-block;margin-top:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 16px;font-size:15px;font-weight:700;color:var(--ai)}
footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3)}
</style>
</head>
